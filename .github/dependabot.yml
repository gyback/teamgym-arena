# Dependabot version updates (ADR-0003, supply chain and security gates).
# Minor and patch updates are grouped into one pull request per ecosystem;
# major updates arrive one per pull request so they can be reviewed on their own.
# Security updates are grouped separately so they are never held back by a
# failing version update. Commit messages follow Conventional Commits.
version: 2

updates:
  # Backend packages. Versions are pinned centrally in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
      nuget-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Frontend packages (ADR-0005): the SPA and the Playwright E2E tests.
  - package-ecosystem: npm
    directories:
      - /src/Web
      - /tests/E2E
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
